<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JSCaleb | Studio Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"/>

<style>
:root{
    --bg:#05060a;
    --surface:#0d111a;
    --text:#f5f5f5;
    --muted:#9aa0a6;
    --gold:#ffd84a;
}

/* ================= GLOBAL ================= */
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Space Grotesk',sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
}

/* ================= LOADING SCREEN ================= */
#loader{
    position:fixed;
    inset:0;
    background:#05060a;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
}
#loader h1{
    color:var(--gold);
    font-size:26px;
    letter-spacing:3px;
    animation:pulse 1.5s infinite;
}
@keyframes pulse{
    0%,100%{opacity:0.4;}
    50%{opacity:1;}
}

/* ================= SCROLL BAR ================= */
#progress{
    position:fixed;
    top:0;
    left:0;
    height:3px;
    width:0%;
    background:var(--gold);
    z-index:9998;
}

/* ================= PARTICLES ================= */
canvas{
    position:fixed;
    inset:0;
    z-index:0;
}

/* ================= CURSOR ================= */
.cursor{
    position:fixed;
    width:220px;
    height:220px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,216,74,0.25), transparent 60%);
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:0;
}

/* ================= HEADER ================= */
header{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:18px 40px;
    background:rgba(5,6,10,0.7);
    backdrop-filter:blur(12px);
    z-index:1000;
    border-bottom:1px solid rgba(255,255,255,0.05);
}
header h1{color:var(--gold);}
nav a{
    margin-left:18px;
    color:var(--muted);
    text-decoration:none;
}
nav a:hover{color:var(--gold);}

/* ================= HERO ================= */
.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    z-index:1;
}
.hero h1{
    font-size:90px;
    background:linear-gradient(90deg,var(--gold),#fff3a0,var(--gold));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
.hero p{color:var(--muted);}
.hero a{
    margin-top:20px;
    padding:12px 26px;
    background:var(--gold);
    color:#000;
    font-weight:700;
    border-radius:10px;
    text-decoration:none;
}

/* ================= SECTIONS ================= */
section{
    padding:120px 20px;
    max-width:1100px;
    margin:auto;
    position:relative;
    z-index:1;
}
.title{
    text-align:center;
    font-size:40px;
    color:var(--gold);
    margin-bottom:40px;
}

/* ================= FEATURED VIDEO ================= */
.featured{
    background:var(--surface);
    border-radius:16px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.05);
}
.featured iframe{
    width:100%;
    height:500px;
}
.featured h3{
    padding:15px;
    color:var(--muted);
}

/* ================= GRID ================= */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}
.card{
    background:var(--surface);
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
}
.card:hover{
    transform:translateY(-6px);
    box-shadow:0 0 30px rgba(255,216,74,0.15);
}
.card img{width:100%;}
.card h4{padding:10px;color:var(--muted);font-size:13px;}

/* ================= CTA ================= */
.cta{
    text-align:center;
    padding:60px;
    background:var(--surface);
    border-radius:16px;
}
.cta h2{color:var(--gold);}
.cta p{color:var(--muted);margin-top:10px;}
.cta a{
    display:inline-block;
    margin-top:20px;
    padding:12px 22px;
    background:var(--gold);
    color:#000;
    font-weight:700;
    border-radius:10px;
    text-decoration:none;
}

/* ================= MODAL ================= */
#modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}
#modal iframe{
    width:80%;
    height:70%;
}
#close{
    position:absolute;
    top:20px;
    right:30px;
    font-size:30px;
    color:var(--gold);
    cursor:pointer;
}
</style>
</head>

<body>

<div id="loader"><h1>JSCALEB STUDIO</h1></div>
<div id="progress"></div>
<canvas id="bg"></canvas>
<div class="cursor"></div>

<header>
<h1>JSCaleb</h1>
<nav>
<a href="#work">Work</a>
<a href="#featured">Featured</a>
<a href="#contact">Contact</a>
</nav>
</header>

<section class="hero">
<h1>JSCaleb</h1>
<p>Roblox Developer • VFX • Scripting • GUI</p>
<a href="#work">Explore Work</a>
</section>

<section id="featured">
<h2 class="title">Featured Work</h2>
<div class="featured" id="featured"></div>
</section>

<section id="work">
<h2 class="title">All Work</h2>
<div class="grid" id="grid"></div>
</section>

<section id="contact">
<div class="cta">
<h2>Hire Me</h2>
<p>Roblox VFX, scripting, GUI systems</p>
<a>Discord: jscaleb8913</a>
</div>
</section>

<div id="modal">
<div id="close">×</div>
<iframe id="frame"></iframe>
</div>

<script>
/* ================= LOADER ================= */
window.addEventListener("load",()=>{
setTimeout(()=>document.getElementById("loader").style.display="none",800);
});

/* ================= SCROLL PROGRESS ================= */
window.addEventListener("scroll",()=>{
let h=document.documentElement;
let scrolled=(h.scrollTop)/(h.scrollHeight-h.clientHeight)*100;
document.getElementById("progress").style.width=scrolled+"%";
});

/* ================= CURSOR ================= */
const cursor=document.querySelector(".cursor");
let mx=0,my=0,cx=0,cy=0;
window.addEventListener("mousemove",(e)=>{mx=e.clientX;my=e.clientY;});
function animate(){
cx+=(mx-cx)*0.12;
cy+=(my-cy)*0.12;
cursor.style.transform=`translate(${cx}px,${cy}px)`;
requestAnimationFrame(animate);
}
animate();

/* ================= PARTICLES ================= */
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<60;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2,
d:Math.random()*1
});
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="rgba(255,216,74,0.3)";
particles.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();
p.y+=p.d;
if(p.y>canvas.height)p.y=0;
});
requestAnimationFrame(draw);
}
draw();

/* ================= YOUTUBE ================= */
const API_KEY="YOUR_API_KEY";
const CHANNEL_ID="UCN0kprprvA-1bWbNzfk6HRg";

fetch(`https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${CHANNEL_ID}&part=snippet,id&order=date&maxResults=8`)
.then(r=>r.json())
.then(d=>{
const grid=document.getElementById("grid");
const featured=document.getElementById("featured");

d.items.forEach((v,i)=>{
if(v.id.videoId){

if(i===0){
featured.innerHTML=`
<iframe src="https://www.youtube.com/embed/${v.id.videoId}" allowfullscreen></iframe>
<h3>${v.snippet.title}</h3>`;
}

const card=document.createElement("div");
card.className="card";
card.innerHTML=`
<img src="${v.snippet.thumbnails.high.url}">
<h4>${v.snippet.title}</h4>`;
card.onclick=()=>open(v.id.videoId);
grid.appendChild(card);
}
});
});

/* ================= MODAL ================= */
const modal=document.getElementById("modal");
const frame=document.getElementById("frame");
document.getElementById("close").onclick=()=>modal.style.display="none";

function open(id){
frame.src=`https://www.youtube.com/embed/${id}`;
modal.style.display="flex";
}
</script>

</body>
</html>
